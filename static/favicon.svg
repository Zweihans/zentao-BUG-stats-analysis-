<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 虫子身体 -->
  <ellipse cx="32" cy="34" rx="12" ry="9" fill="#1a1a1b"/>
  <!-- 虫子头部 -->
  <circle cx="32" cy="24" r="6" fill="#1a1a1b"/>
  <!-- 触角 -->
  <line x1="28" y1="19" x2="22" y2="12" stroke="#1a1a1b" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="19" x2="42" y2="12" stroke="#1a1a1b" stroke-width="2" stroke-linecap="round"/>
  <!-- 触角顶端圆点 -->
  <circle cx="22" cy="12" r="2.5" fill="#7C3AED"/>
  <circle cx="42" cy="12" r="2.5" fill="#7C3AED"/>
  <!-- 眼睛 -->
  <circle cx="30" cy="23" r="1.5" fill="#7C3AED"/>
  <circle cx="34" cy="23" r="1.5" fill="#7C3AED"/>
  <!-- 身体纹路 -->
  <line x1="24" y1="32" x2="40" y2="32" stroke="#7C3AED" stroke-width="1.2"/>
  <line x1="23" y1="36" x2="41" y2="36" stroke="#7C3AED" stroke-width="1.2"/>
  <!-- 六条腿 -->
  <line x1="20" y1="28" x2="14" y2="24" stroke="#1a1a1b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="33" x2="13" y2="31" stroke="#1a1a1b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="38" x2="14" y2="40" stroke="#1a1a1b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="50" y2="24" stroke="#1a1a1b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="44" y1="33" x2="51" y2="31" stroke="#1a1a1b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="44" y1="38" x2="50" y2="40" stroke="#1a1a1b" stroke-width="1.8" stroke-linecap="round"/>
</svg>
