<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="32" cy="32" r="30" fill="url(#g)"/>
  <!-- 虫子身体 -->
  <ellipse cx="32" cy="34" rx="12" ry="9" fill="#fff" opacity="0.95"/>
  <!-- 虫子头部 -->
  <circle cx="32" cy="24" r="6" fill="#fff" opacity="0.95"/>
  <!-- 触角 -->
  <line x1="28" y1="19" x2="22" y2="12" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="19" x2="42" y2="12" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- 触角顶端圆点 -->
  <circle cx="22" cy="12" r="2" fill="#FDE68A"/>
  <circle cx="42" cy="12" r="2" fill="#FDE68A"/>
  <!-- 眼睛 -->
  <circle cx="30" cy="23" r="1.5" fill="#7C3AED"/>
  <circle cx="34" cy="23" r="1.5" fill="#7C3AED"/>
  <!-- 身体纹路 -->
  <line x1="24" y1="32" x2="40" y2="32" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
  <line x1="23" y1="36" x2="41" y2="36" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
  <!-- 六条腿 -->
  <line x1="20" y1="28" x2="14" y2="24" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="20" y1="33" x2="13" y2="31" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="20" y1="38" x2="14" y2="40" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="44" y1="28" x2="50" y2="24" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="44" y1="33" x2="51" y2="31" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="44" y1="38" x2="50" y2="40" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
</svg>
